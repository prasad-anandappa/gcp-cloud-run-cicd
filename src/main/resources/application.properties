spring.application.name=gcp-cloud-run-cicd

# Cloud Run injects PORT; default 8080 keeps local runs identical.
server.port=${PORT:8080}
server.shutdown=graceful

# Actuator: expose only health + info. /actuator/health is the Cloud Run
# startup/liveness probe target used in infra/main.tf.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

logging.level.root=INFO
